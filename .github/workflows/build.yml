name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Structure if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.qersheen --platforms android .
          fi

      - name: Add Permissions to AndroidManifest
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"/>' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Fix plugins namespaces for AGP 8+
        run: |
          for dir in /home/runner/.pub-cache/hosted/pub.dev/notification_listener_service-*; do
            if [ -d "$dir/android" ]; then
              sed -i '/android {/a \    namespace "com.cachet.notification_listener_service"' "$dir/android/build.gradle" 2>/dev/null || true
            fi
          done

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qersheen-App
          path: build/app/outputs/flutter-apk/app-release.apk
