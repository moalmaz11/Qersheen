version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  fl_chart: ^1.2.0
  permission_handler: ^11.3.0
  flutter_sms_inbox: ^1.0.3
  local_auth: ^3.0.2
  pdf: ^3.13.0
